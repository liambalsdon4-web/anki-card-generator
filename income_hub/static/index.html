<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Income Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fbfbfd; --bg-alt:#f5f5f7; --surface:#ffffff;
  --ink:#1d1d1f; --ink-2:#424245; --muted:#6e6e73; --faint:#86868b;
  --line:rgba(0,0,0,.08); --line-2:rgba(0,0,0,.14);
  --green:#00a862; --green-2:#0bc57c; --green-ink:#0a7a48;
  --blue:#0071e3; --red:#ff3b30; --amber:#ff9500; --purple:#8e5cff; --sky:#0aa2c0;
  --r:22px; --r-sm:14px; --r-pill:980px;
  --disp:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;
  --sans:'Manrope',ui-sans-serif,system-ui,sans-serif;
  --shadow:0 12px 44px -18px rgba(20,24,30,.28);
  --shadow-sm:0 2px 10px -4px rgba(20,24,30,.16);
  --nav-h:56px;
}
html{scroll-behavior:smooth}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  letter-spacing:-.011em;
}
::selection{background:rgba(0,168,98,.18);color:var(--green-ink)}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.16);border-radius:8px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,.28);background-clip:padding-box}
a{color:inherit;text-decoration:none}

.disp{font-family:var(--disp)}
.eyebrow{font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--green-ink)}
.tnum{font-feature-settings:"tnum" 1,"ss01" 1}

/* ── Top nav ── */
#top-nav{position:sticky;top:0;z-index:900;height:var(--nav-h);
  background:rgba(251,251,253,.72);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);
  border-bottom:1px solid transparent;transition:border-color .3s,background .3s}
#top-nav.scrolled{border-bottom-color:var(--line);background:rgba(251,251,253,.86)}
.nav-inner{max-width:1160px;margin:0 auto;height:100%;padding:0 26px;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:11px;flex:1;min-width:0}
.brand .mk{width:31px;height:31px;border-radius:9px;background:linear-gradient(145deg,var(--green-2),var(--green));
  display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--disp);font-weight:700;font-size:17px;
  box-shadow:0 6px 16px -6px rgba(0,168,98,.7)}
.brand .name{font-family:var(--disp);font-weight:600;font-size:19px;letter-spacing:-.02em}
/* segmented control */
.seg{display:flex;gap:2px;padding:3px;background:rgba(0,0,0,.05);border-radius:var(--r-pill)}
.seg-item{position:relative;padding:7px 15px;border-radius:var(--r-pill);cursor:pointer;font-size:13.5px;font-weight:600;
  color:var(--muted);transition:color .2s;user-select:none;white-space:nowrap}
.seg-item:hover{color:var(--ink)}
.seg-item.active{color:var(--ink);background:var(--surface);box-shadow:var(--shadow-sm)}
.nav-right{flex:1;display:flex;align-items:center;justify-content:flex-end;gap:14px}
.ai-pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--muted);
  padding:5px 11px;border-radius:var(--r-pill);border:1px solid var(--line)}
.ai-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.ai-pill.on .dot{background:var(--green);box-shadow:0 0 0 3px rgba(0,168,98,.16)}
.ai-pill.off .dot{background:var(--red);box-shadow:0 0 0 3px rgba(255,59,48,.14)}

/* ── Layout ── */
#content{min-height:calc(100vh - var(--nav-h))}
.wrap{max-width:1160px;margin:0 auto;padding:0 26px}
.section{padding:64px 0}
.section.tight{padding:40px 0}
.band{background:var(--bg-alt)}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:26px;flex-wrap:wrap}
.sec-title{font-family:var(--disp);font-weight:600;font-size:30px;letter-spacing:-.025em;line-height:1.05}
.sec-sub{color:var(--muted);font-size:15px;margin-top:6px}

/* reveal on scroll */
.reveal{opacity:0;transform:translateY(30px);transition:opacity .85s cubic-bezier(.16,1,.3,1),transform .85s cubic-bezier(.16,1,.3,1);
  transition-delay:var(--d,0ms)}
.reveal.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.reveal{transition:none;opacity:1;transform:none}html{scroll-behavior:auto}}

/* ── Hero (Overview) ── */
.hero{position:relative;text-align:center;padding:76px 0 30px;overflow:hidden}
.hero::before{content:'';position:absolute;left:50%;top:-40px;transform:translateX(-50%);
  width:min(760px,88vw);height:420px;pointer-events:none;z-index:0;
  background:radial-gradient(closest-side,rgba(11,197,124,.16),transparent 72%);filter:blur(6px)}
.hero>*{position:relative;z-index:1}
.hero .live{display:inline-flex;align-items:center;gap:8px;margin-bottom:20px;
  font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--green-ink)}
.hero .live i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(0,168,98,.5);animation:ping 2.4s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(0,168,98,.45)}70%{box-shadow:0 0 0 10px rgba(0,168,98,0)}100%{box-shadow:0 0 0 0 rgba(0,168,98,0)}}
.hero-figure{font-family:var(--disp);font-weight:700;font-size:clamp(66px,13vw,150px);line-height:.9;letter-spacing:-.045em}
.hero-figure .cur{color:var(--green);font-weight:600;font-size:.42em;vertical-align:.42em;margin-right:.03em}
.hero-sub{margin-top:26px;font-size:clamp(17px,2.2vw,21px);color:var(--muted);font-weight:500}
.hero-sub b{color:var(--ink);font-weight:700}
.hero-sub .sep{color:var(--line-2);margin:0 10px}

/* ── Stat trio ── */
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.statc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px 26px 24px;
  box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .3s cubic-bezier(.16,1,.3,1),box-shadow .3s}
.statc:hover{transform:translateY(-4px);box-shadow:0 22px 60px -22px rgba(20,24,30,.32)}
.statc .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.statc .lbl{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.statc .ico{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:16px}
.statc .val{font-family:var(--disp);font-weight:600;font-size:46px;letter-spacing:-.03em;line-height:1}
.statc .val .cur{font-size:.52em;vertical-align:.16em;margin-right:.02em;font-weight:500}
.statc .foot{margin-top:12px;font-size:13.5px;color:var(--muted);font-weight:500}
.statc.green .val,.statc.green .ico{color:var(--green)}.statc.green .ico{background:rgba(0,168,98,.1)}
.statc.red .val,.statc.red .ico{color:var(--red)}.statc.red .ico{background:rgba(255,59,48,.1)}
.statc.ink .ico{color:var(--ink);background:rgba(0,0,0,.05)}

/* ── Chart / by-type ── */
.dualgrid{display:grid;grid-template-columns:1.55fr 1fr;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);position:relative;overflow:hidden}
.card-pad{padding:26px 28px}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.card-title{font-family:var(--disp);font-weight:600;font-size:19px;letter-spacing:-.02em}
.card-sub{color:var(--muted);font-size:13px}
.bk-row{display:flex;align-items:center;gap:13px;padding:11px 0;border-bottom:1px solid var(--line)}
.bk-row:last-child{border-bottom:none}
.bk-row .lab{width:92px;font-size:13.5px;font-weight:600;text-transform:capitalize;color:var(--ink-2)}
.bk-track{flex:1;height:8px;border-radius:6px;background:rgba(0,0,0,.06);overflow:hidden}
.bk-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--green),var(--green-2));transform-origin:left;
  transform:scaleX(0);transition:transform 1s cubic-bezier(.16,1,.3,1) .2s}
.reveal.in .bk-fill{transform:scaleX(1)}
.bk-val{width:64px;text-align:right;font-family:var(--disp);font-weight:600;font-size:15px;color:var(--green-ink)}

/* ── Stream list ── */
.streamlist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.srow{display:grid;grid-template-columns:1fr auto auto 150px 92px;gap:18px;align-items:center;padding:19px 26px;
  border-bottom:1px solid var(--line);transition:background .18s;position:relative}
.srow:last-child{border-bottom:none}
.srow:hover{background:var(--bg-alt)}
.sname{font-family:var(--disp);font-weight:600;font-size:17px;letter-spacing:-.01em}
.snote{font-size:13px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:340px}
.smrr{text-align:right;font-family:var(--disp);font-weight:600;font-size:19px;letter-spacing:-.02em}
.smrr .per{font-size:12px;color:var(--faint);font-weight:500;font-family:var(--sans)}
.smrr.pos{color:var(--green)}.smrr.zero{color:var(--faint)}
.sacts{display:flex;gap:7px;justify-content:flex-end;opacity:0;transition:opacity .18s}
.srow:hover .sacts{opacity:1}
.icobtn{width:32px;height:32px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--muted);
  cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.icobtn:hover{color:var(--ink);border-color:var(--ink-2);transform:translateY(-1px)}
.icobtn.d:hover{color:#fff;background:var(--red);border-color:var(--red)}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:var(--r-pill);border:1px solid transparent;
  cursor:pointer;font-family:var(--sans);font-size:14px;font-weight:700;letter-spacing:-.01em;transition:all .18s cubic-bezier(.2,.7,.3,1);white-space:nowrap}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--green);color:#fff;box-shadow:0 8px 22px -10px rgba(0,168,98,.75)}
.btn-primary:hover:not(:disabled){background:var(--green-ink);transform:translateY(-2px);box-shadow:0 14px 30px -12px rgba(0,168,98,.8)}
.btn-dark{background:var(--ink);color:#fff}
.btn-dark:hover:not(:disabled){background:#000;transform:translateY(-2px)}
.btn-secondary{background:rgba(0,0,0,.05);color:var(--ink)}
.btn-secondary:hover{background:rgba(0,0,0,.09)}
.btn-danger{background:rgba(255,59,48,.1);color:var(--red)}
.btn-danger:hover{background:var(--red);color:#fff}
.btn-sm{padding:7px 14px;font-size:13px}

/* ── Badges ── */
.badge{display:inline-flex;align-items:center;padding:4px 11px;border-radius:var(--r-pill);font-size:11.5px;
  font-weight:700;letter-spacing:.01em;text-transform:capitalize;background:rgba(0,0,0,.05);color:var(--ink-2);white-space:nowrap}
.badge-green{color:var(--green-ink);background:rgba(0,168,98,.12)}
.badge-cyan{color:var(--sky);background:rgba(10,162,192,.12)}
.badge-amber{color:#b26a00;background:rgba(255,149,0,.14)}
.badge-purple{color:var(--purple);background:rgba(142,92,255,.12)}
.badge-blue{color:var(--blue);background:rgba(0,113,227,.12)}
.badge-red{color:var(--red);background:rgba(255,59,48,.12)}
.badge-muted{color:var(--muted);background:rgba(0,0,0,.05)}

/* ── Cards grid (saas) ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}
.idea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px 24px 20px;box-shadow:var(--shadow);
  transition:transform .3s cubic-bezier(.16,1,.3,1),box-shadow .3s}
.idea:hover{transform:translateY(-4px);box-shadow:0 22px 60px -22px rgba(20,24,30,.32)}
.idea-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:6px}
.idea-title{font-family:var(--disp);font-weight:600;font-size:20px;letter-spacing:-.02em;line-height:1.15}
.idea-sub{color:var(--muted);font-size:13.5px;margin-top:5px;line-height:1.45}
.score{font-family:var(--disp);font-weight:600;font-size:30px;text-align:right;letter-spacing:-.03em;line-height:1}
.score small{display:block;font-family:var(--sans);font-size:10px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.14em;margin-top:4px}
.submetrics{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}
.sm{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:8px;background:var(--bg-alt);color:var(--muted)}
.sm b{color:var(--ink)}

/* ── Kanban ── */
.board{display:grid;grid-template-columns:repeat(6,minmax(168px,1fr));gap:13px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--bg-alt);border:1px solid var(--line);border-radius:16px;padding:13px;min-height:150px}
.col-head{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);
  margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.col-head span{background:rgba(0,0,0,.06);border-radius:var(--r-pill);padding:1px 8px;font-size:10.5px;color:var(--muted)}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px;cursor:pointer;
  transition:all .18s cubic-bezier(.16,1,.3,1);box-shadow:var(--shadow-sm)}
.vcard:hover{border-color:var(--green);transform:translateY(-3px);box-shadow:0 12px 26px -12px rgba(0,168,98,.35)}
.vcard .t{font-family:var(--disp);font-weight:600;font-size:14px;line-height:1.3}
.vcard .m{font-size:11.5px;color:var(--faint);margin-top:6px;display:flex;align-items:center;gap:6px}
.qtag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;text-transform:uppercase;letter-spacing:.04em}
.qtag.running{color:var(--green-ink);background:rgba(0,168,98,.12)}
.qtag.queued{color:var(--muted);background:rgba(0,0,0,.06)}
.qtag.failed{color:var(--red);background:rgba(255,59,48,.12)}
.qtag.done{color:var(--blue);background:rgba(0,113,227,.1)}

/* ── Render queue panel ── */
.qpanel{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px 20px;margin-bottom:22px}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.qhead .t{font-family:var(--disp);font-weight:600;font-size:16.5px;display:flex;align-items:center;gap:10px}
.qcount{font-size:11px;font-weight:700;color:var(--muted);background:rgba(0,0,0,.05);border-radius:20px;padding:2px 9px}
.qrow{padding:12px 0 13px;border-top:1px solid var(--line)}
.qrow-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.qrow .qn{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.qrow .qright{display:flex;align-items:center;gap:9px;flex:none}
.qs{font-size:12px;font-weight:700;text-transform:capitalize}
.qs.running{color:var(--green-ink)}.qs.queued{color:var(--muted)}.qs.failed{color:var(--red)}
.qbar{height:6px;border-radius:6px;background:rgba(0,0,0,.06);overflow:hidden}
.qbar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--green),var(--green-2));transition:width .6s cubic-bezier(.16,1,.3,1)}
.qbar.run>i{animation:qpulse 1.4s ease-in-out infinite}
.qbar.fail>i{background:var(--red)}
@keyframes qpulse{0%,100%{opacity:.65}50%{opacity:1}}

/* ── Betting ── */
.calc-head-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
.calc-legs{display:flex;flex-direction:column;gap:9px}
.calc-leg{display:grid;grid-template-columns:26px 1.4fr 1fr 92px 88px 32px;gap:9px;align-items:center}
.calc-i{width:26px;height:26px;border-radius:50%;background:var(--bg-alt);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:var(--muted)}
.calc-stake{font-family:var(--disp);font-weight:600;font-size:15px;text-align:right;color:var(--green-ink)}
.calc-out{margin-top:16px;border-top:1px solid var(--line);padding-top:16px}
.calc-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.cm-n{font-family:var(--disp);font-weight:600;font-size:23px;letter-spacing:-.02em}
.cm-l{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);margin-top:3px}
.calc-flag{margin-top:14px;font-weight:700;font-size:14px;padding:9px 14px;border-radius:12px;display:inline-block}
.calc-flag.ok{color:var(--green-ink);background:rgba(0,168,98,.12)}
.calc-flag.bad{color:var(--red);background:rgba(255,59,48,.1)}
.calc-hint{color:var(--muted);font-size:13.5px}
.arbcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px 20px;margin-bottom:14px}
.arb-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:6px}
.leg-row{display:grid;grid-template-columns:1.3fr .7fr 74px 88px auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
.leg-set{display:flex;gap:5px;justify-content:flex-end}
.mini{padding:5px 9px;font-size:11px;font-weight:700;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;color:var(--muted);transition:all .14s}
.mini:hover{border-color:var(--ink-2);color:var(--ink)}
.mini.on-won{background:var(--green);color:#fff;border-color:var(--green)}
.mini.on-lost{background:var(--red);color:#fff;border-color:var(--red)}
.mini.on-void{background:var(--muted);color:#fff;border-color:var(--muted)}
/* ── Micro-SaaS pipeline ── */
.saas-cols{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:13px;overflow-x:auto;padding-bottom:8px}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow-sm);transition:all .16s cubic-bezier(.16,1,.3,1)}
.scard:hover{border-color:var(--green);transform:translateY(-3px);box-shadow:0 12px 26px -12px rgba(0,168,98,.32)}
.scard-t{font-family:var(--disp);font-weight:600;font-size:14.5px;line-height:1.25}
.scard-sub{font-size:12px;color:var(--muted);margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.scard-foot{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.dchip{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--bg-alt);color:var(--muted);text-transform:capitalize}
.dchip.on{background:rgba(0,168,98,.12);color:var(--green-ink)}
.dsec{border:1px solid var(--line);border-radius:14px;padding:16px 17px;margin-bottom:14px}
.dsec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.dsec-head .t{font-family:var(--disp);font-weight:600;font-size:16px}
.kv{margin-bottom:13px}
.kv>b{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);margin-bottom:5px}
.kv p{font-size:13.5px;color:var(--ink-2);line-height:1.55}
.kv .li{font-size:13px;color:var(--ink-2);padding:3px 0;line-height:1.5}
.kv ul{margin:3px 0 3px 18px}.kv li{font-size:12.5px;color:var(--muted);padding:1px 0}
.chips2{display:flex;flex-wrap:wrap;gap:6px}
.stage-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.stage-btn{padding:6px 12px;border-radius:var(--r-pill);border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-size:12px;font-weight:700;color:var(--muted);transition:all .14s}
.stage-btn:hover{border-color:var(--ink-2);color:var(--ink)}
.stage-btn.on{background:var(--green);color:#fff;border-color:var(--green)}
.tasrow{display:flex;align-items:center;gap:9px;padding:6px 0}
.tasrow input[type=checkbox]{width:17px;height:17px;accent-color:var(--green);flex:none;margin-top:1px}
@media(max-width:820px){.saas-cols{grid-template-columns:repeat(3,minmax(180px,1fr))}}

/* arb scanner */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 16px}
.chip-toggle{padding:7px 13px;border-radius:var(--r-pill);border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);transition:all .15s}
.chip-toggle:hover{border-color:var(--ink-2);color:var(--ink)}
.chip-toggle.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.scan-card{border:1px solid var(--line);border-radius:14px;padding:15px 17px;margin-bottom:11px;background:var(--bg-alt);transition:border-color .2s}
.scan-card:hover{border-color:var(--line-2)}
.scan-leg{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-top:1px dashed var(--line)}
.scan-leg:first-of-type{border-top:none}

@media(max-width:720px){.calc-leg{grid-template-columns:22px 1fr 78px 74px 28px}.calc-leg select{display:none}
  .calc-metrics{grid-template-columns:1fr 1fr}.trio[style*="repeat(4"]{grid-template-columns:1fr 1fr!important}}
@media(max-width:860px){.grid[style*="1.4fr 1fr"]{grid-template-columns:1fr!important}}

/* ── Forms ── */
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;
  padding:11px 14px;color:var(--ink);font-size:14.5px;font-family:var(--sans);outline:none;transition:border-color .16s,box-shadow .16s}
input:focus,select:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(0,168,98,.14)}
textarea{resize:vertical;min-height:70px}
label{display:block;font-size:12px;font-weight:700;letter-spacing:.03em;color:var(--muted);margin-bottom:8px}
.row{margin-bottom:16px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.toolbar{display:flex;gap:12px;margin-bottom:26px;flex-wrap:wrap;align-items:center}

/* ── Misc components ── */
.hint{font-size:14px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:16px 18px;margin-bottom:22px;line-height:1.6;box-shadow:var(--shadow-sm)}
.hint code{font-family:ui-monospace,monospace;background:var(--bg-alt);padding:2px 7px;border-radius:6px;color:var(--green-ink);font-size:12.5px;font-weight:600}
.section-title{font-size:12px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.12em}
.pipeline-steps{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.step{flex:1;min-width:92px;text-align:center;padding:10px;border-radius:11px;background:var(--bg-alt);border:1px solid var(--line);
  font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.step.done{background:rgba(0,168,98,.12);color:var(--green-ink);border-color:rgba(0,168,98,.28)}
.step.active{background:rgba(255,149,0,.14);color:#b26a00;border-color:rgba(255,149,0,.32)}
.empty{text-align:center;padding:80px 20px;color:var(--muted)}
.empty .ico{font-size:46px;margin-bottom:16px}
.empty .big{font-family:var(--disp);font-weight:600;font-size:24px;color:var(--ink);margin-bottom:8px;letter-spacing:-.02em}
.spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(0,0,0,.18);border-top-color:var(--green);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── Modal ── */
.modal-bg{position:fixed;inset:0;background:rgba(20,24,30,.34);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:1500;padding:20px;animation:fade .22s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(14px)}to{opacity:1;transform:none}}
.modal{background:var(--surface);border-radius:26px;width:600px;max-width:96vw;max-height:90vh;display:flex;flex-direction:column;
  box-shadow:0 40px 100px -30px rgba(20,24,30,.5);animation:pop .34s cubic-bezier(.16,1,.3,1);overflow:hidden}
.modal-head{padding:22px 26px;border-bottom:1px solid var(--line);font-family:var(--disp);font-weight:600;font-size:21px;letter-spacing:-.02em;display:flex;justify-content:space-between;align-items:center;gap:14px}
.modal-body{padding:24px 26px;overflow-y:auto}
.modal-foot{padding:18px 26px;border-top:1px solid var(--line);display:flex;gap:11px;justify-content:flex-end;flex-wrap:wrap}
.x{background:rgba(0,0,0,.05);border:none;color:var(--muted);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:19px;flex:none;transition:all .15s}
.x:hover{background:rgba(0,0,0,.1);color:var(--ink)}

/* ── Footer ── */
footer{border-top:1px solid var(--line);padding:28px 0;color:var(--faint);font-size:13px}
footer .wrap{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}

/* ── Mind map ── */
.map-wrap{position:relative;padding:14px 0 6px}
.map-stage{position:relative;width:min(1120px,95vw);aspect-ratio:1120/780;margin:0 auto;overflow:visible}
.map-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.conn{fill:none;stroke:var(--line-2);stroke-width:1.6;stroke-linecap:round;
  stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s cubic-bezier(.16,1,.3,1) forwards var(--d,0ms)}
.conn.conn-leaf{stroke:var(--line)}
.conn.hot{stroke:var(--green);stroke-width:2.4}
.conn.hidden-branch{opacity:0;transition:opacity .35s}
@keyframes draw{to{stroke-dashoffset:0}}

.mnode{position:absolute;transform:translate(-50%,-50%);z-index:2}
.mnode.open{z-index:60}
.mnode.hidden-branch{opacity:0;transform:translate(-50%,-50%) scale(.3);pointer-events:none;transition:opacity .35s,transform .35s}
.mnode-in{opacity:0;transform:scale(.4);animation:nodepop .55s cubic-bezier(.16,1,.3,1) forwards var(--d,0ms);
  transition:transform .32s cubic-bezier(.16,1,.3,1),box-shadow .32s,border-color .2s,width .32s cubic-bezier(.16,1,.3,1)}
@keyframes nodepop{to{opacity:1;transform:scale(1)}}
.map-stage.has-active .mnode:not(.open) .mnode-in{opacity:.42;filter:saturate(.55)}

/* hub — circular core */
.hub .mnode-in{background:radial-gradient(120% 120% at 40% 30%,#ffffff,#e9edec);border:1px solid var(--line-2);border-radius:50%;
  box-shadow:0 30px 70px -22px rgba(20,24,30,.5),inset 0 1px 0 #fff;width:198px;height:198px;padding:12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:default}
.hub .mnode-in::after{content:'';position:absolute;inset:-9px;border-radius:50%;border:1px solid rgba(0,168,98,.28);pointer-events:none}
.hub .h-lbl{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--green-ink)}
.hub .h-fig{font-family:var(--disp);font-weight:700;font-size:42px;letter-spacing:-.03em;line-height:1;margin:8px 0 6px}
.hub .h-fig .cur{color:var(--green);font-size:.5em;vertical-align:.2em;font-weight:600}
.hub .h-sub{font-size:12px;color:var(--muted);font-weight:600}

/* type branch node */
.tnode .mnode-in{background:var(--ink);color:#fff;border-radius:999px;padding:9px 16px;cursor:pointer;
  box-shadow:0 14px 32px -14px rgba(0,0,0,.55);display:flex;align-items:center;gap:10px;white-space:nowrap}
.tnode .mnode-in:hover{transform:scale(1.05)}
.tnode.collapsed .mnode-in{background:#fff;color:var(--ink);border:1px solid var(--line-2)}
.tnode .t-name{font-family:var(--disp);font-weight:600;font-size:13.5px;letter-spacing:-.01em}
.tnode .t-cnt{font-size:11px;font-weight:700;background:rgba(255,255,255,.18);border-radius:20px;padding:1px 8px}
.tnode.collapsed .t-cnt{background:rgba(0,0,0,.07)}

/* leaf source node — organic pill */
.leaf .mnode-in{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:10px;padding:10px 16px 10px 12px;max-width:198px;cursor:pointer}
.leaf .mnode-in:hover{transform:scale(1.05);box-shadow:0 20px 46px -18px rgba(20,24,30,.44);border-color:var(--line-2)}
.mn-dot{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 0 3px rgba(0,0,0,.04)}
.mn-txt{min-width:0}
.mn-name{font-family:var(--disp);font-weight:600;font-size:14.5px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.mn-mrr{font-size:12.5px;font-weight:700;color:var(--green);margin-top:1px}
.mn-mrr.zero{color:var(--faint)}.mn-mrr span{color:var(--faint);font-weight:500;font-size:10.5px}

/* empty-state add node */
.addnode .mnode-in{background:transparent;border:2px dashed var(--line-2);border-radius:22px;width:200px;padding:18px;
  text-align:center;color:var(--muted);font-weight:700;cursor:pointer;box-shadow:none}
.addnode .mnode-in:hover{border-color:var(--green);color:var(--green-ink);transform:scale(1.03)}

/* ── Detail page (pushed view) ── */
#content{transition:transform .44s cubic-bezier(.16,1,.3,1),filter .44s,opacity .44s;transform-origin:center 42%}
#content.pushed{transform:scale(.955);filter:blur(3px);opacity:.4;pointer-events:none}
#detail-layer{position:fixed;inset:0;z-index:1200;background:var(--bg);overflow-y:auto;opacity:0;pointer-events:none;
  transform:translateY(26px) scale(.985);transition:opacity .44s cubic-bezier(.16,1,.3,1),transform .44s cubic-bezier(.16,1,.3,1)}
#detail-layer.show{opacity:1;pointer-events:auto;transform:none}
.detail-top{position:sticky;top:0;background:rgba(251,251,253,.8);backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid var(--line);z-index:5}
.detail-top .inner{max-width:920px;margin:0 auto;padding:14px 26px;display:flex;justify-content:space-between;align-items:center;gap:14px}
.detail-body{max-width:920px;margin:0 auto;padding:8px 26px 90px}
.detail-hero{text-align:center;padding:44px 0 30px}
.d-dot{display:inline-block;width:18px;height:18px;border-radius:50%;margin-bottom:18px;box-shadow:0 0 0 5px rgba(0,0,0,.04)}
.d-name{font-family:var(--disp);font-weight:700;font-size:clamp(40px,7vw,74px);letter-spacing:-.035em;line-height:1}
.d-badges{display:flex;gap:8px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.d-figs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
.d-panel{margin-bottom:16px}
.d-bars{display:flex;flex-direction:column}
.d-bar{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.d-bar:last-child{border-bottom:none}
.d-bar-l{color:var(--muted);font-weight:600;font-size:14.5px}
.d-bar-v{font-family:var(--disp);font-weight:600;font-size:19px;letter-spacing:-.02em}
.d-actions{display:flex;gap:12px;justify-content:center;margin-top:30px}
/* staggered entrance */
#detail-layer.show .detail-top,#detail-layer.show .detail-body>*{opacity:0;transform:translateY(20px);animation:drise .6s cubic-bezier(.16,1,.3,1) forwards}
#detail-layer.show .detail-top{animation-delay:.05s}
#detail-layer.show .detail-body>*:nth-child(1){animation-delay:.12s}
#detail-layer.show .detail-body>*:nth-child(2){animation-delay:.20s}
#detail-layer.show .detail-body>*:nth-child(3){animation-delay:.28s}
#detail-layer.show .detail-body>*:nth-child(4){animation-delay:.36s}
#detail-layer.show .detail-body>*:nth-child(5){animation-delay:.44s}
@keyframes drise{to{opacity:1;transform:none}}
@media(max-width:640px){.d-figs{grid-template-columns:1fr}}

@media(max-width:900px){
  .seg-item{padding:7px 11px;font-size:12.5px}
  .brand .name{display:none}
  .ai-pill span:not(.dot){display:none}
  .trio{grid-template-columns:1fr}
  .dualgrid{grid-template-columns:1fr}
  .srow{grid-template-columns:1fr auto;gap:10px}
  .srow .col-type,.srow .col-status{display:none}
}

/* ── Goal progress bar ── */
.goal-bar-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 26px;box-shadow:var(--shadow)}
.goal-bar-track{height:10px;border-radius:6px;background:rgba(0,0,0,.06);overflow:hidden;margin:14px 0 8px}
.goal-bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--green),var(--green-2));transition:width 1.2s cubic-bezier(.16,1,.3,1)}
.goal-labels{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;color:var(--muted)}

/* ── Freelance tab ── */
.fl-table{width:100%;border-collapse:collapse}
.fl-table th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:10px 14px;border-bottom:2px solid var(--line)}
.fl-table td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:14px}
.fl-table tr:last-child td{border-bottom:none}
.fl-table tr:hover td{background:var(--bg-alt)}
.fl-table .mono{font-family:ui-monospace,monospace;font-size:13px}
.proj-status-btn{padding:4px 10px;border-radius:var(--r-pill);border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-size:11px;font-weight:700;color:var(--muted);transition:all .14s}
.proj-status-btn:hover{border-color:var(--ink-2);color:var(--ink)}
.proj-status-btn.on{background:var(--green);color:#fff;border-color:var(--green)}
.inv-status{display:inline-flex;align-items:center;padding:3px 9px;border-radius:var(--r-pill);font-size:11px;font-weight:700;white-space:nowrap}
.inv-draft{color:var(--muted);background:rgba(0,0,0,.05)}
.inv-sent{color:#b26a00;background:rgba(255,149,0,.14)}
.inv-paid{color:var(--green-ink);background:rgba(0,168,98,.12)}
.inv-overdue{color:var(--red);background:rgba(255,59,48,.12)}

/* ── Kelly calc ── */
.kelly-out{margin-top:16px;border-top:1px solid var(--line);padding-top:16px}

/* ── Costs ledger ── */
.cost-row{display:grid;grid-template-columns:1fr auto 90px 32px;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.cost-row:last-child{border-bottom:none}
</style>
</head>

  <div class="nav-inner">
